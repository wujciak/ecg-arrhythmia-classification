[project]
name = "ecg-arrhythmia-classification"
version = "1.0.0"
description = "Heartbeat classification on MIT-BIH with LSTM and CNN-LSTM models, evaluated inter-patient (DS1/DS2) and intra-patient"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow>=2.18",
    "wfdb>=4.1",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecg"]

[tool.ruff]
line-length = 100
